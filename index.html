<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kusmi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/style/css/main.css" />
    <link rel="icon" type="image/png" href="./assets/icons/logo.png" />
    <script type="module" src="./assets/js/main.js"></script>
    <meta
      name="description"
      content="Rafraîchissez-vous avec le nouveau soda Kusmi. Un mélange pétillant unique de citron vert, orange, pamplemousse et plantes pour une pause stimulante."
    />
  </head>

  <body>
    <header>
      <h1>Kusmi</h1>
      <nav>
        <ul>
          <li><a href="#section1">Lien 1</a></li>
          <li><a href="#section2">Lien 2</a></li>
          <li><a href="#section3">Lien 3</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="section1">
        <h2>Lien 1</h2>
        <p>Contenu de la section.</p>
      </section>

      <section id="section2">
        <h2>Lien 2</h2>
        <p>Contenu de la section.</p>
      </section>

      <section id="section3">
        <h2>Lien 3</h2>
        <table>
          <thead>
            <tr>
              <th>Colonne 1</th>
              <th>Colonne 2</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Donnée 1</td>
              <td>Donnée 2</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section id="contact">
        <h2>Contactez-nous</h2>
        <form method="post" action="">
          <fieldset>
            <legend>Votre message</legend>

            <label for="nom">Votre nom *</label>
            <input type="text" id="nom" name="nom" required />

            <label for="email">Votre email *</label>
            <input type="email" id="email" name="email" required />

            <label for="message">Votre message *</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Envoyer</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>Footer</p>
    </footer>
  </body>
</html>
